[project]
name = "civic-pilot"
version = "0.1.0"
description = "Civic Pulse Part 3: assisted execution agent for public-service portals"
authors = [
    { name = "Kanhaiya76618", email = "kanhaiyakumar76618@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=1.20",
    "numpy==2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "psycopg2-binary==2.9.13",
    "pydantic>=2.14.2",
    "pynacl==1.6.2",
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "python-dotenv==1.2.4",
    "python-jose==3.5.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "shapely==2.2.0",
    "sqlalchemy==2.1.6",
    "supabase==2.33.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: talks to real government portals or public APIs over the internet"]
